
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговый терминал</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --green: #22c55e;
            --primary: #6366f1;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: var(--green); }
        .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; color: #94a3b8; }
        .row span { color: var(--text); font-weight: 600; }
        .links-box { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .link-btn {
            display: block;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }
        .link-btn.okx { background: #000; border: 2px solid #22c55e; color: #22c55e; }
        .link-btn.dex { background: #334155; }
        .back { display: inline-block; margin-bottom: 16px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back">← Назад к списку сигналов</a>
    
    <div class="card">
        <h2 id="tokenTitle">📊 Терминал сделки</h2>
        <div class="row"><span>Контракт:</span> <span id="tokenAddr" style="font-size:0.75rem; word-break: break-all; color:#38bdf8;">Загрузка...</span></div>
        <div class="row"><span>Сеть:</span> <span style="color: #f59e0b;">BNB Smart Chain (BSC)</span></div>
        <div class="row"><span>Ваш бюджет:</span> <span>$20.00</span></div>
        <div class="row"><span>Лимит на сделку (25%):</span> <span style="color: var(--green);">$5.00</span></div>
        
        <div class="links-box">
            <!-- Покупка через OKX DEX в сети BSC (работает для 100% токенов без ошибок 404) -->
            <a id="okxLink" href="#" target="_blank" class="link-btn okx">🪙 Купить через OKX Wallet (DEX)</a>
            
            <!-- Живой график -->
            <a id="dexLink" href="#" target="_blank" class="link-btn dex">📈 Открыть график DexScreener</a>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const name = params.get('name') || 'Token';

    document.getElementById('tokenTitle').innerText = `🚀 ${name}`;
    document.getElementById('tokenAddr').innerText = token;
    
    // Прямой свап через агрегатор OKX DEX на сети BSC (chainId = 56)
    document.getElementById('okxLink').href = `https://www.okx.com/web3/dex?inputChain=56&inputCurrency=BNB&outputChain=56&outputCurrency=${token}`;
    
    // График DexScreener
    document.getElementById('dexLink').href = `https://dexscreener.com/bsc/${token}`;
</script>

</body>
</html>
