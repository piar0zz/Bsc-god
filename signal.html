<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Быстрый терминал сделки</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --green: #22c55e;
            --primary: #10b981;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        h2 { margin-top: 0; color: var(--green); }
        .row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; color: #94a3b8; }
        .row span { color: var(--text); font-weight: 600; }
        .links-box { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        .link-btn {
            display: block;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
        }
        .link-btn.pump { background: #10b981; }
        .link-btn.photon { background: #ec4899; }
        .back { display: inline-block; margin-bottom: 16px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back">← Назад к списку сигналов</a>
    
    <div class="card">
        <h2 id="tokenTitle">🚀 Мгновенная сделка</h2>
        <div class="row"><span>Адрес Mint:</span> <span id="tokenAddr" style="font-size:0.75rem; word-break: break-all; color:#38bdf8;">Загрузка...</span></div>
        <div class="row"><span>Сеть:</span> <span style="color: #14f195;">Solana (Pump.fun)</span></div>
        <div class="row"><span>Реком. сумма:</span> <span style="color: var(--green);">$5.00</span></div>
        
        <div class="links-box">
            <!-- Прямая покупка на Pump.fun без задержек -->
            <a id="pumpLink" href="#" target="_blank" class="link-btn pump">💊 Открыть на Pump.fun</a>
            
            <!-- Снайперский терминал Photon (для моментальной покупки с телефона) -->
            <a id="photonLink" href="#" target="_blank" class="link-btn photon">⚡ Купить через Photon / BullX</a>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const name = params.get('name') || 'Token';

    document.getElementById('tokenTitle').innerText = `🚀 ${name}`;
    document.getElementById('tokenAddr').innerText = token;
    
    document.getElementById('pumpLink').href = `https://pump.fun/${token}`;
    document.getElementById('photonLink').href = `https://photon-sol.tinyastro.io/en/r/@pump/${token}`;
</script>

</body>
</html>
