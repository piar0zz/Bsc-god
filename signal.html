<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Торговый терминал с графиком</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --green: #22c55e;
            --primary: #6366f1;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            margin-bottom: 16px;
        }
        h2 { margin-top: 0; color: var(--green); font-size: 1.2rem; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; }
        .row span { color: var(--text); font-weight: 600; }
        
        /* Контейнер встроенного графика */
        .chart-container {
            width: 100%;
            height: 350px;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            margin-top: 12px;
            border: 1px solid #334155;
        }
        .chart-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .links-box { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .link-btn {
            display: block;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .link-btn.okx { background: #000; border: 2px solid #22c55e; color: #22c55e; }
        .link-btn.dex { background: #334155; }
        .back { display: inline-block; margin-bottom: 16px; color: #94a3b8; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back">← Назад к списку сигналов</a>
    
    <div class="card">
        <h2 id="tokenTitle">📊 Терминал токена</h2>
        <div class="row"><span>Контракт:</span> <span id="tokenAddr" style="font-size:0.75rem; word-break: break-all; color:#38bdf8;">Загрузка...</span></div>
        <div class="row"><span>Сеть:</span> <span id="chainName" style="color: #f59e0b;">Загрузка...</span></div>
        <div class="row"><span>Ликвидность:</span> <span id="liqVal" style="color: var(--green);">Загрузка...</span></div>
        <div class="row"><span>Объем 24ч:</span> <span id="volVal">Загрузка...</span></div>
        <div class="row"><span>Лимит на сделку (25%):</span> <strong style="color: var(--green);">$5.00 из $20</strong></div>

        <!-- Встроенный живой график DexScreener прямо на странице -->
        <div class="chart-container" id="chartBox">
            <!-- Сюда подгрузится график -->
        </div>
        
        <div class="links-box" id="actionLinks">
            <!-- Кнопки покупки подгрузятся динамически -->
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const name = params.get('name') || 'Token';
    let chain = params.get('chain') || 'bsc';

    document.getElementById('tokenTitle').innerText = `🚀 ${name}`;
    document.getElementById('tokenAddr').innerText = token;

    // Встраиваем живой график DexScreener iframe прямо в страницу
    // setTheme=dark делает его темным под стиль нашего сайта, links=0 убирает лишние шапки
    const chartBox = document.getElementById('chartBox');
    chartBox.innerHTML = `<iframe src="https://dexscreener.com/${chain}/${token}?embed=1&theme=dark&trades=0&info=0"></iframe>`;

    // Подтягиваем реальные свежие метрики по этому контракту через API DexScreener
    async function fetchTokenMetrics() {
        try {
            const res = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${token}`);
            const data = await res.json();

            if (data && data.pairs && data.pairs.length > 0) {
                // Ищем нужную пару под нашу сеть
                const pair = data.pairs.find(p => p.chainId === chain) || data.pairs[0];
                
                document.getElementById('chainName').innerText = pair.chainId.toUpperCase();
                document.getElementById('liqVal').innerText = `$${Math.floor(pair.liquidity?.usd || 0).toLocaleString()}`;
                document.getElementById('volVal').innerText = `$${Math.floor(pair.volume?.h24 || 0).toLocaleString()}`;
            } else {
                document.getElementById('liqVal').innerText = 'Данные уточняются';
                document.getElementById('volVal').innerText = '-';
            }
        } catch (e) {
            console.error('Ошибка загрузки метрик:', e);
        }
    }

    fetchTokenMetrics();

    // Отрисовка кнопок в зависимости от сети
    const linksBox = document.getElementById('actionLinks');
    if (chain === 'solana') {
        linksBox.innerHTML = `
            <a href="https://solscan.io/token/${token}" target="_blank" class="link-btn okx">🔍 Посмотреть в Solscan</a>
            <a href="https://dexscreener.com/solana/${token}" target="_blank" class="link-btn dex">📈 Открыть на DexScreener</a>
        `;
    } else {
        linksBox.innerHTML = `
            <a href="https://www.okx.com/web3/dex?inputChain=56&inputCurrency=BNB&outputChain=56&outputCurrency=${token}" target="_blank" class="link-btn okx">🪙 Купить через OKX Wallet (BSC)</a>
            <a href="https://dexscreener.com/bsc/${token}" target="_blank" class="link-btn dex">📈 Открыть на DexScreener</a>
        `;
    }
</script>

</body>
</html>
