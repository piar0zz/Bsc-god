<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Chain Moonshot Sniper</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --green: #22c55e;
            --red: #ef4444;
            --primary: #6366f1;
            --solana: #14f195;
            --bsc: #f3ba2f;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        header {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.1rem; margin: 0; }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn.active { background: var(--green); }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            border-left: 4px solid var(--green);
        }
        .card.sol { border-left-color: var(--solana); }
        .card.bsc { border-left-color: var(--bsc); }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; color: #94a3b8; }
        .row span { color: var(--text); font-weight: 500; }
        .details-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--green);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 12px;
            box-sizing: border-box;
        }
        .status { text-align: center; font-size: 0.8rem; color: #64748b; margin-bottom: 12px; }
        .time-badge { font-size: 0.75rem; background: #334155; padding: 2px 6px; border-radius: 4px; color: #cbd5e1; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>🚀 Moonshot Radar</h1>
            <div style="font-size: 0.75rem; color: #94a3b8;">BSC + Solana | Бюджет: $20</div>
        </div>
        <button class="btn" id="notifBtn" onclick="requestPermission()">🔔 Пуши</button>
    </header>

    <div class="status" id="statusBar">🛡️ Сканирование сетей (BSC & Solana)...</div>

    <div id="feed"></div>
</div>

<script>
    function requestPermission() {
        if (!("Notification" in window)) return alert("Браузер не поддерживает пуши");
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                const btn = document.getElementById('notifBtn');
                btn.classList.add('active');
                btn.innerText = '🔔 Включено';
                alert("Уведомления активированы!");
            }
        });
    }

    function sendPush(title, body) {
        if (Notification.permission === "granted") {
            new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/616/616490.png' });
        }
    }

    // Загрузка истории из localStorage при открытии страницы
    document.addEventListener("DOMContentLoaded", () => {
        loadSignalsFromStorage();
    });

    function getSavedSignals() {
        const saved = localStorage.getItem('moon_signals');
        return saved ? JSON.parse(saved) : [];
    }

    function saveSignalToStorage(data) {
        let signals = getSavedSignals();
        // Проверяем на дубликаты
        if (!signals.some(s => s.address === data.address)) {
            signals.unshift(data); // Добавляем в начало
            if (signals.length > 15) signals.pop(); // Храним максимум 15 штук
            localStorage.setItem('moon_signals', JSON.stringify(signals));
        }
    }

    function loadSignalsFromStorage() {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        const signals = getSavedSignals();
        
        signals.forEach(data => {
            renderCard(data, false);
        });
    }

    function renderCard(data, isNew = false) {
        const feed = document.getElementById('feed');
        if (document.getElementById(`token-${data.address}`)) return;

        const card = document.createElement('div');
        card.id = `token-${data.address}`;
        card.className = `card ${data.chain === 'solana' ? 'sol' : 'bsc'}`;
        
        const chainName = data.chain === 'solana' ? '⚡ Solana' : '🟡 BSC';
        
        card.innerHTML = `
            <div class="row">
                <strong style="font-size: 1rem;">${data.name} ($${data.symbol})</strong>
                <span class="time-badge">${data.time}</span>
            </div>
            <div class="row"><span>Сеть:</span> <span style="color: ${data.chain === 'solana' ? '#14f195' : '#f3ba2f'};">${chainName}</span></div>
            <div class="row"><span>Ликвидность:</span> <span style="color:#38bdf8;">$${data.liquidity.toLocaleString()}</span></div>
            <div class="row"><span>Лимит на сделку:</span> <strong style="color:var(--green);">$5.00 (25%)</strong></div>
            <a href="signal.html?token=${data.address}&name=${encodeURIComponent(data.name)}&chain=${data.chain}" class="details-btn">⚡ Открыть терминал покупки</a>
        `;
        
        feed.prepend(card);

        if (isNew) {
            sendPush(`🚀 РАКЕТА [${chainName}]: ${data.name}`, `Ликвидность: $${data.liquidity.toLocaleString()} | Время: ${data.time}`);
        }
    }

    // Сканер сетей BSC и Solana
    async function scanForMoonshots() {
        try {
            const response = await fetch('https://api.dexscreener.com/token-profiles/latest/v1');
            const data = await response.json();
            
            if (Array.isArray(data)) {
                // Фильтруем сети bsc и solana
                const targets = data.filter(t => (t.chainId === 'bsc' || t.chainId === 'solana') && t.tokenAddress);
                
                for (let t of targets.slice(0, 5)) {
                    const pairRes = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${t.tokenAddress}`);
                    const pairData = await pairRes.json();

                    if (pairData && pairData.pairs && pairData.pairs.length > 0) {
                        const pair = pairData.pairs[0];
                        const liquidity = pair.liquidity?.usd || 0;
                        const volume = pair.volume?.h24 || 0;

                        // Фильтр ликвидности и объема
                        if (liquidity >= 1000 && liquidity <= 30000 && volume >= 500) {
                            const now = new Date();
                            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                            const tokenData = {
                                name: pair.baseToken.name || 'Gem',
                                symbol: pair.baseToken.symbol || 'GEM',
                                address: pair.baseToken.address,
                                liquidity: Math.floor(liquidity),
                                chain: pair.chainId,
                                time: timeString
                            };

                            // Сохраняем в память и выводим
                            saveSignalToStorage(tokenData);
                            renderCard(tokenData, true);
                            break; 
                        }
                    }
                }
            }
        } catch (e) {
            console.error('Ошибка сканирования:', e);
        }
    }

    scanForMoonshots();
    setInterval(scanForMoonshots, 25000);
</script>

</body>
</html>
