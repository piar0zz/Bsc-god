<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Pump Sniper (Filtered)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --green: #22c55e;
            --red: #ef4444;
            --primary: #10b981;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        header {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.1rem; margin: 0; }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn.active { background: var(--green); }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            border-left: 4px solid var(--primary);
        }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; color: #94a3b8; }
        .row span { color: var(--text); font-weight: 500; }
        .details-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 12px;
            box-sizing: border-box;
        }
        .status { text-align: center; font-size: 0.8rem; color: #10b981; margin-bottom: 12px; font-weight: bold; }
        .time-badge { font-size: 0.75rem; background: #334155; padding: 2px 6px; border-radius: 4px; color: #cbd5e1; }
        .socials { font-size: 0.8rem; color: #38bdf8; margin-top: 4px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>🛡️ Elite Pump Sniper</h1>
            <div style="font-size: 0.75rem; color: #94a3b8;">Фильтр мусора: ВКЛ</div>
        </div>
        <button class="btn" id="notifBtn" onclick="requestPermission()">🔔 Пуши</button>
    </header>

    <div class="status" id="statusBar">🟢 Сканирование с жестким отбором...</div>

    <div id="feed"></div>
</div>

<script>
    let ws;

    function requestPermission() {
        if (!("Notification" in window)) return alert("Браузер не поддерживает пуши");
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                const btn = document.getElementById('notifBtn');
                btn.classList.add('active');
                btn.innerText = '🔔 Включено';
                alert("Уведомления активированы!");
            }
        });
    }

    function sendPush(title, body) {
        if (Notification.permission === "granted") {
            new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/616/616490.png' });
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadSignalsFromStorage();
        connectWebSocket();
    });

    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                connectWebSocket();
            }
        }
    });

    function getSavedSignals() {
        const saved = localStorage.getItem('elite_moon_signals');
        return saved ? JSON.parse(saved) : [];
    }

    function saveSignalToStorage(data) {
        let signals = getSavedSignals();
        if (!signals.some(s => s.address === data.address)) {
            signals.unshift(data);
            if (signals.length.length > 15) signals.pop();
            localStorage.setItem('elite_moon_signals', JSON.stringify(signals));
        }
    }

    function loadSignalsFromStorage() {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        const signals = getSavedSignals();
        signals.forEach(data => renderCard(data, false));
    }

    function renderCard(data, isNew = false) {
        const feed = document.getElementById('feed');
        if (document.getElementById(`token-${data.address}`)) return;

        const card = document.createElement('div');
        card.id = `token-${data.address}`;
        card.className = 'card';
        
        let socialHtml = '';
        if (data.twitter || data.telegram) {
            socialHtml = `<div class="socials">🔗 ${data.twitter ? 'Twitter ' : ''}${data.telegram ? 'Telegram' : ''}</div>`;
        }

        card.innerHTML = `
            <div class="row">
                <strong style="font-size: 1rem;">${data.name} ($${data.symbol})</strong>
                <span class="time-badge">${data.time}</span>
            </div>
            <div class="row"><span>Ликвидность кривой:</span> <span style="color:#38bdf8;">~${data.solAmount} SOL</span></div>
            ${socialHtml}
            <div class="row"><span>Липкий вход ($20):</span> <strong style="color:var(--green);">$5.00 (25%)</strong></div>
            <a href="signal.html?token=${data.address}&name=${encodeURIComponent(data.name)}&chain=solana" class="details-btn">⚡ Открыть терминал и график</a>
        `;
        
        feed.prepend(card);

        if (isNew) {
            sendPush(`💎 ЭЛИТНЫЙ ГЕМ: ${data.name} ($${data.symbol})`, `Ликвидность: ~${data.solAmount} SOL | Жми для входа!`);
        }
    }

    function connectWebSocket() {
        if (ws) ws.close();

        ws = new WebSocket('wss://pumpportal.fun/api/data');

        ws.onopen = () => {
            document.getElementById('statusBar').innerText = '🟢 Стрим активен (Фильтрация шлака)...';
            ws.send(JSON.stringify({ method: "subscribeNewToken" }));
        };

        ws.onmessage = (event) => {
            try {
                const data = JSON.parse(event.data);
                
                if (data && data.mint) {
                    const solInCurve = data.vSolInBondingCurve || 0;
                    const name = data.name || '';
                    const symbol = data.symbol || '';
                    const twitter = data.twitter;
                    const telegram = data.telegram;

                    // ЖЕСТКИЕ КРИТЕРИИ ОТБОРА (Убийцы мусора):
                    
                    // 1. Ликвидность кривой должна быть в здоровом диапазоне (от 1 до 25 SOL), 
                    // чтобы исключить пустые тесты и уже пропампепленные монеты.
                    const isHealthyLiq = solInCurve >= 1.0 && solInCurve <= 25.0;

                    // 2. Защита от безымянного мусора (у монеты должно быть нормальное имя и тикер)
                    const hasValidName = name.length > 1 && symbol.length > 1 && !name.toLowerCase().includes('test');

                    // 3. Дополнительный фильтр качества: приветствуем наличие соцсетей (но не отсекаем наглухо, если их нет, но ликвидность хорошая)
                    // Для теста сделаем так: если ликвидность отличная, пропускаем. Если есть соцсети — бонус к приоритету.
                    
                    if (isHealthyLiq && hasValidName) {
                        const now = new Date();
                        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                        const tokenData = {
                            name: name,
                            symbol: symbol,
                            address: data.mint,
                            solAmount: solInCurve.toFixed(2),
                            twitter: twitter,
                            telegram: telegram,
                            time: timeString
                        };

                        saveSignalToStorage(tokenData);
                        renderCard(tokenData, true);
                    }
                }
            } catch (e) {
                console.error('Ошибка парсинга:', e);
            }
        };

        ws.onclose = () => {
            document.getElementById('statusBar').innerText = '🔴 Переподключение...';
            setTimeout(connectWebSocket, 3000);
        };
    }
</script>

</body>
</html>
