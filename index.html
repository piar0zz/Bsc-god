<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Moonshot Sniper</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --green: #22c55e;
            --red: #ef4444;
            --primary: #6366f1;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        header {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.1rem; margin: 0; }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn.active { background: var(--green); }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            border-left: 4px solid var(--green);
        }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; color: #94a3b8; }
        .row span { color: var(--text); font-weight: 500; }
        .details-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--green);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 12px;
            box-sizing: border-box;
        }
        .status { text-align: center; font-size: 0.8rem; color: #64748b; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>🚀 Moonshot Radar</h1>
            <div style="font-size: 0.75rem; color: #94a3b8;">Бюджет: $20 | Вход: $5 (25%)</div>
        </div>
        <button class="btn" id="notifBtn" onclick="requestPermission()">🔔 Пуши</button>
    </header>

    <div class="status" id="statusBar">🛡️ Фильтры активны: ищем заряженные ракеты...</div>

    <div id="feed"></div>
</div>

<script>
    function requestPermission() {
        if (!("Notification" in window)) return alert("Браузер не поддерживает пуши");
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                const btn = document.getElementById('notifBtn');
                btn.classList.add('active');
                btn.innerText = '🔔 Включено';
                alert("Уведомления активированы!");
            }
        });
    }

    function sendPush(title, body) {
        if (Notification.permission === "granted") {
            new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/616/616490.png' });
        }
    }

    function addSignal(data) {
        const feed = document.getElementById('feed');
        if (document.getElementById(`token-${data.address}`)) return;

        const card = document.createElement('div');
        card.id = `token-${data.address}`;
        card.className = 'card';
        
        card.innerHTML = `
            <div class="row">
                <strong style="font-size: 1rem;">${data.name} ($${data.symbol})</strong>
                <span style="color: var(--green);">🔥 Гем найден</span>
            </div>
            <div class="row"><span>Ликвидность:</span> <span style="color:#38bdf8;">$${data.liquidity.toLocaleString()}</span></div>
            <div class="row"><span>Объем торгов:</span> <span>$${data.volume.toLocaleString()}</span></div>
            <div class="row"><span>Лимит на сделку:</span> <strong style="color:var(--green);">$5.00</strong></div>
            <a href="signal.html?token=${data.address}&name=${encodeURIComponent(data.name)}" class="details-btn">⚡ Влететь через OKX / DexScreener</a>
        `;
        
        feed.prepend(card);
        if (feed.children.length > 8) feed.lastChild.remove();

        sendPush(`🚀 РАКЕТА: ${data.name} ($${data.symbol})`, `Ликвидность: $${data.liquidity.toLocaleString()} | Жми для входа!`);
    }

    // Жесткий сканер-фильтр по последним профилям и ликвидности BSC
    async function scanForMoonshots() {
        try {
            const response = await fetch('https://api.dexscreener.com/token-profiles/latest/v1');
            const data = await response.json();
            
            if (Array.isArray(data)) {
                // Берем только BSC
                const bscTokens = data.filter(t => t.chainId === 'bsc' && t.tokenAddress);
                
                for (let t of bscTokens) {
                    // Проверяем метрики конкретного токена
                    const pairRes = await fetch(`https://api.dexscreener.com/latest/dex/tokens/${t.tokenAddress}`);
                    const pairData = await pairRes.json();

                    if (pairData && pairData.pairs && pairData.pairs.length > 0) {
                        const pair = pairData.pairs[0];
                        const liquidity = pair.liquidity?.usd || 0;
                        const volume = pair.volume?.h24 || 0;

                        // СТРОГИЕ КРИТЕРИИ ГЕМА:
                        // Ликвидность от $1,500 до $25,000 (чтобы не уношенный рост)
                        // Суточный объем больше $800 (чтобы жизнь кипела)
                        if (liquidity >= 1500 && liquidity <= 25000 && volume >= 800) {
                            addSignal({
                                name: pair.baseToken.name || 'MoonToken',
                                symbol: pair.baseToken.symbol || 'MOON',
                                address: pair.baseToken.address,
                                liquidity: Math.floor(liquidity),
                                volume: Math.floor(volume)
                            });
                            break; // Нашли качественный вариант за проход — пушим
                        }
                    }
                }
            }
        } catch (e) {
            console.error('Ошибка фильтрации монеток:', e);
        }
    }

    scanForMoonshots();
    setInterval(scanForMoonshots, 20000);
</script>

</body>
</html>
