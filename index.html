<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSC Fresh Alpha Radar</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --green: #22c55e;
            --red: #ef4444;
            --primary: #6366f1;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        header {
            background: var(--card);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.1rem; margin: 0; }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn.active { background: var(--green); }
        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
            border-left: 4px solid var(--green);
        }
        .row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.9rem; color: #94a3b8; }
        .row span { color: var(--text); font-weight: 500; }
        .details-btn {
            display: block;
            width: 100%;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 12px;
            box-sizing: border-box;
        }
        .status { text-align: center; font-size: 0.8rem; color: #64748b; margin-bottom: 12px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>⚡ Fresh BSC Alpha</h1>
            <div style="font-size: 0.75rem; color: #94a3b8;">Бюджет: $20 (Вход: $5)</div>
        </div>
        <button class="btn" id="notifBtn" onclick="requestPermission()">🔔 Пуши</button>
    </header>

    <div class="status" id="statusBar">📡 Мониторинг свежих релизов BSC...</div>

    <div id="feed"></div>
</div>

<script>
    function requestPermission() {
        if (!("Notification" in window)) return alert("Браузер не поддерживает пуши");
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                const btn = document.getElementById('notifBtn');
                btn.classList.add('active');
                btn.innerText = '🔔 Включено';
                alert("Уведомления активны!");
            }
        });
    }

    function sendPush(title, body) {
        if (Notification.permission === "granted") {
            new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/616/616490.png' });
        }
    }

    function addSignal(data) {
        const feed = document.getElementById('feed');
        if (document.getElementById(`token-${data.address}`)) return;

        const card = document.createElement('div');
        card.id = `token-${data.address}`;
        card.className = 'card';
        
        card.innerHTML = `
            <div class="row">
                <strong style="font-size: 1rem;">${data.name} ($${data.symbol})</strong>
                <span style="color: var(--green);">🔥 Свежак</span>
            </div>
            <div class="row"><span>Ликвидность:</span> <span>$${data.liquidity.toLocaleString()}</span></div>
            <div class="row"><span>Вход ($20 портфель):</span> <strong style="color:var(--green);">$5.00 (25%)</strong></div>
            <a href="signal.html?token=${data.address}&name=${encodeURIComponent(data.name)}&liq=${data.liquidity}" class="details-btn">⚡ Открыть терминал покупки</a>
        `;
        
        feed.prepend(card);
        if (feed.children.length > 8) feed.lastChild.remove();

        sendPush(`🚀 Новый альфа-токен: ${data.name} ($${data.symbol})`, `Ликвидность: $${data.liquidity.toLocaleString()} | Жми для входа!`);
    }

    // Загрузка абсолютно свежих пар сети BSC напрямую через глобальный поиск по новым тикерам
    async function fetchFreshTokens() {
        try {
            // Используем поисковой запрос с упором на свежие мем-символы и популярные префиксы
            const queries = ['pepe', 'doge', 'ai', 'cat', 'elon', 'moon', 'baby', 'bsc'];
            const randomQuery = queries[Math.floor(Math.random() * queries.length)];
            
            const response = await fetch(`https://api.dexscreener.com/latest/dex/search?q=${randomQuery}`);
            const data = await response.json();
            
            if (data && data.pairs) {
                // Фильтруем строго сеть BSC, исключаем мертвяк (берем свежие пулы с ликвидностью от $800 до $30,000)
                const freshPairs = data.pairs.filter(p => 
                    p.chainId === 'bsc' && 
                    p.liquidity?.usd > 800 && 
                    p.liquidity?.usd < 30000
                );
                
                if (freshPairs.length > 0) {
                    // Сортируем по дате создания (самые новые сверху, если есть поле pairCreatedAt, иначе рандом из свежих)
                    freshPairs.sort((a, b) => (b.pairCreatedAt || 0) - (a.pairCreatedAt || 0));
                    
                    const pair = freshPairs[0]; // Берем самый свежий из найденных по запросу
                    
                    addSignal({
                        name: pair.baseToken.name || 'AlphaToken',
                        symbol: pair.baseToken.symbol || 'ALPHA',
                        address: pair.baseToken.address,
                        liquidity: Math.floor(pair.liquidity.usd)
                    });
                }
            }
        } catch (e) {
            console.error('Ошибка загрузки свежих данных:', e);
        }
    }

    fetchFreshTokens();
    setInterval(fetchFreshTokens, 25000);
</script>

</body>
</html>
